  aleph:
    icon: gem
    color: '#8b5cf6'
    leadAgentSlug: cto
    status: in_progress
    workspaces:
      aleph-apps:
        name: aleph-apps
        defaultRef: main
        isPrimary: true
        repoRef: coder/ale-1080-agent-usage-plugin
