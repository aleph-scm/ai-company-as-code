        sourceType: git_repo
        visibility: default
      prod:
        name: prod
        metadata:
          githubRepositoryId: '1218168277'
        defaultRef: main
        repoRef: ale918-sync
        repoUrl: https://github.com/aleph-scm/prod
        sourceType: git_repo
        visibility: default
  blog:
    icon: globe
    color: '#f59e0b'
    leadAgentSlug: writer
    status: in_progress
    workspaces:
      blog-aleph-brain:
        name: Blog/aleph-brain
        metadata:
          githubRepositoryId: '1379408425'
        repoUrl: https://github.com/aleph-scm/aleph-brain
        sourceType: git_repo
        visibility: default
      blog-blog:
        name: Blog/blog
        defaultRef: main
        isPrimary: true
        repoRef: writer/ale-1956-falsifier-hid-defect
        repoUrl: https://github.com/aleph-scm/blog
        sourceType: git_repo
        visibility: default
      public-presence-agent-bwrap:
        name: Public presence/agent-bwrap
        repoUrl: https://github.com/aleph-scm/agent-bwrap
        sourceType: git_repo
        visibility: default
      public-presence-awt-site:
        name: Public presence/awt-site
        metadata:
          githubRepositoryId: '1390376110'
        repoUrl: https://github.com/aleph-scm/awt-site
        sourceType: git_repo
        visibility: default
      public-presence-financial-dashboard:
        name: Public presence/financial-dashboard
        repoUrl: https://github.com/aleph-scm/financial-dashboard
        sourceType: git_repo
        visibility: default
      public-presence-paperclip-plugin-agent-usage:
        name: Public presence/paperclip-plugin-agent-usage
        repoUrl: https://github.com/piranesi0/paperclip-plugin-agent-usage
        sourceType: git_repo
        visibility: default
schemaVersion: 7
