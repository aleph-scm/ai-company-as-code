schema: paperclip/v1
agents:
  adversary:
    role: general
    icon: swords
    capabilities: Attacks plans before budget is committed and outputs before they
      are called done, naming the load-bearing assumption and what would falsify it;
      no veto, but its critique blocks the target issue until answered in writing.
    adapter:
      config:
        model: example-provider/example-model
        timeoutSec: 600
      type: opencode_local
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: pink-lemonade
      schemaVersion: 1
  ceo:
    role: ceo
    adapter:
      config:
        effort: medium
        engine: cli
      type: claude_local
    runtime:
      heartbeat:
        enabled: true
        intervalSec: 43200
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
    - permissionKey: agents:configure
    - permissionKey: skills:create
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: lime-lagoon
      schemaVersion: 1
  coder:
    role: engineer
    icon: code
    capabilities: Implements coding tasks end-to-end - code, tests, CI/CD, and deployment
      - with focused verification.
    adapter:
      config:
        command: codex
        dangerouslyBypassApprovalsAndSandbox: true
        engine: cli
        filesystemExtraPaths:
        - access: ro
          path: /home/paperclip/.npm/_npx/867707d436975b17/node_modules/@openai/codex-linux-x64
        filesystemSandboxCommand: /usr/local/lib/paperclip/bwrap
        filesystemScope: workspace
        timeoutSec: 2100
      type: codex_local
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: cherry-pop
      schemaVersion: 1
  coo:
    role: general
    icon: cog
    capabilities: 'Owns Aleph''s information supply chain and operating rhythm: specifies
      and routes research, records, and reporting work across Researcher, Librarian
      and Summarizer, holds the quality bar on their output before it reaches the
      CEO, and makes sure decisions become tickets with owners.'
    adapter:
      config:
        effort: medium
        engine: cli
      type: claude_local
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: pink-lemonade
      schemaVersion: 1
  cto:
    role: cto
    icon: crown
    capabilities: 'Owns architecture, infrastructure and deploys. Breaks company goals
      into well-specified engineering tickets and takes the hardest ones personally.
      Continues to own the running system: environments, Paperclip/adapter configuration,
      deployments and rollbacks, runtime and workspace health, error triage and first
      response, and secrets hygiene.'
    adapter:
      config:
        effort: medium
        engine: cli
      type: claude_local
    runtime:
      heartbeat:
        enabled: true
        intervalSec: 86400
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: electric-grove
      schemaVersion: 1
  designer:
    role: designer
    icon: gem
    capabilities: "Owns one visual identity across example.com and blog.example.com \u2014 writes\
      \ the type/colour/spacing system down in aleph-brain, then implements it as\
      \ PRs on both Astro site repos."
    adapter:
      config:
        model: example-provider/example-model
        timeoutSec: 2700
      type: opencode_local
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: flamingo-jade
      schemaVersion: 1
  dreamer:
    role: general
    icon: sparkles
    capabilities: Generates ten outward-facing what-ifs a week; originates nothing,
      decides nothing.
    adapter:
      config:
        model: example-provider/example-model
        timeoutSec: 900
      type: opencode_local
    permissionGrants:
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: bubblegum-sky
      schemaVersion: 1
  librarian:
    role: general
    icon: database
    capabilities: 'Owns Aleph''s institutional memory: captures decisions with their
      reasoning, maintains documentation standards, answers other agents'' context
      questions with citations, and surfaces contradictions between records.'
    adapter:
      config:
        effort: medium
        engine: cli
        timeoutSec: 2700
      type: claude_local
    runtime:
      heartbeat:
        enabled: true
        intervalSec: 86400
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: orchid-peach
      schemaVersion: 1
  navigator:
    role: general
    icon: target
    capabilities: 'Owns where Aleph goes next: reads the ideas pipeline (Dreamer,
      Scout, Reader, idea tickets), promotes at least one idea a week into a ticket
      with a cheapest test, a cost, a falsifier and a date, disposes of the rest in
      one line, owns Lane D of the ALE-63 experiment portfolio, and specifies the
      Researcher''s briefs.'
    adapter:
      config:
        effort: medium
        engine: cli
      type: claude_local
    permissionGrants:
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: golden-hour
      schemaVersion: 1
  qa:
    role: qa
    icon: bug
    capabilities: Verifies every implementation against its ticket's written acceptance
      criteria, reproduces defects, produces pass/fail findings backed by real command
      output, and holds a security veto that forces a written answer before a change
      ships.
    adapter:
      config:
        model: example-provider/example-model
        timeoutSec: 1800
      type: opencode_local
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: arctic-blue
      schemaVersion: 1
    inputs:
      env:
        PAPERCLIP_SANDBOX_NPX_RO:
          description: Optional default for PAPERCLIP_SANDBOX_NPX_RO on agent qa
          kind: plain
          default: '1'
          requirement: optional
  reader:
    role: general
    icon: eye
    capabilities: Weekly release-notes digest for the services Aleph runs; five lines
      per source.
    adapter:
      config:
        model: example-provider/example-model
        timeoutSec: 900
      type: opencode_local
    permissionGrants:
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: ultraviolet-tide
      schemaVersion: 1
  researcher:
    role: researcher
    icon: telescope
    capabilities: Produces evidence-based research briefs with one recommendation,
      sources, risks, and a cheap next validation step.
    adapter:
      config:
        model: example-provider/example-model
        timeoutSec: 1800
      type: opencode_local
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: coral-current
      schemaVersion: 1
  reviewer:
    role: general
    icon: eye
    capabilities: 'Second code review on every PR across aleph-scm repos and piranesi0/etw:
      correctness, security, tests, and scope-vs-ticket, independent of QA''s acceptance-criteria
      check. Routes never-list-touching PRs to a CTO review.'
    adapter:
      config:
        command: codex
        dangerouslyBypassApprovalsAndSandbox: true
        engine: cli
        filesystemExtraPaths:
        - access: ro
          path: /home/paperclip/.npm/_npx/867707d436975b17/node_modules/@openai/codex-linux-x64
        - access: ro
          path: /home/paperclip/.codex/auth.json
        filesystemSandboxCommand: /usr/local/lib/paperclip/bwrap
        filesystemScope: workspace
        timeoutSec: 1800
      type: codex_local
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: coral-current
      schemaVersion: 1
    inputs:
      env:
        CODEX_HOME:
          description: Optional default for CODEX_HOME on agent reviewer
          kind: plain
          default: /home/paperclip/.paperclip/instances/default/companies/example-company-id/agents/example-agent-id/codex-home
          portability: system_dependent
          requirement: optional
  scout:
    role: general
    icon: radar
    capabilities: Weekly landscape scan on a rotating theme; five sourced findings
      with links and dates.
    adapter:
      config:
        model: example-provider/example-model
        timeoutSec: 900
      type: opencode_local
    permissionGrants:
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: flamingo-jade
      schemaVersion: 1
  standby:
    role: engineer
    icon: code
    capabilities: Standby engineering seat on the Claude subscription. Takes over
      an in-flight engineering ticket when the Codex seat is out of allowance (5-hour
      window at 90%+, or a provider quota kill) and hands it back when the window
      resets. Does not pick up work on its own.
    adapter:
      config:
        effort: medium
        engine: cli
        timeoutSec: 2700
      type: claude_local
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
    - permissionKey: agents:configure
    - permissionKey: agents:suggest-changes
    - permissionKey: audit:view_agent_actions
    - permissionKey: inbox:manage
      scope:
        responsibleUserOnly: true
    - permissionKey: skills:create
    - permissionKey: skills:suggest-changes
    - permissionKey: tasks:assign
    - permissionKey: tasks:assign_scope
      scope:
        subtreeRootAgentId: standby
    - permissionKey: tasks:manage_active_checkouts
    - permissionKey: tools:manage_connections
    - permissionKey: tools:manage_profiles
    - permissionKey: tools:manage_runtime
    - permissionKey: tools:use
    - permissionKey: tools:view_audit
    appearance:
      characterVersion: cap-v1
      paletteId: turquoise-cherry
      schemaVersion: 1
  writer:
    role: general
    icon: message-square
    capabilities: 'Owns the prose of everything Aleph publishes: drafts and revises
      posts for blog.example.com, authors and enforces the voice/tone style guide in aleph-brain,
      and verifies every technical claim against a file, commit, run log, or primary
      source before handoff.'
    adapter:
      config:
        effort: medium
        engine: cli
      type: claude_local
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
    - permissionKey: tasks:assign
    appearance:
      characterVersion: cap-v1
      paletteId: pink-lemonade
      schemaVersion: 1
company:
  logoPath: images/company-logo.png
