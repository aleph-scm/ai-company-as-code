# Install to /etc/systemd/system/paperclip.service.d/30-memory.conf
#
# Captured verbatim from the live prod host on 2026-09-25 (not in
# aleph-scm/prod — see the note in ../paperclip.service).
#
# ALE-23: cap the control plane and its agent runs so a runaway run is throttled
# by the cgroup rather than leaving the OOM killer to pick a victim by oom_score
# (which would not be Paperclip). Agent subprocesses share this service cgroup,
# so this ceiling covers them too.
#
# 15 GB box. MemoryHigh applies reclaim pressure first; MemoryMax is the hard
# wall. Tune upward if legitimate agent runs start getting throttled.
[Service]
MemoryHigh=4G
MemoryMax=6G
