# Install to /etc/systemd/system/paperclip.service.d/10-path.conf
#
# Captured verbatim from the live prod host on 2026-09-25 (not in
# aleph-scm/prod — see the note in ../paperclip.service).
#
# Claude Code is a per-user native install at ~paperclip/.local/bin; systemd's
# default PATH omits it, so the Claude adapter probe reported "Command not found
# in PATH: claude" for both the ACP and CLI lanes.
[Service]
Environment=PATH=/home/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
